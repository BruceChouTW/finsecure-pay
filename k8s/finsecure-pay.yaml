apiVersion: v1
kind: ConfigMap
metadata:
  name: finsecure-pay-config
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: "finsecure-pay"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay
  labels:
    app: finsecure-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-pay
  template:
    metadata:
      labels:
        app: finsecure-pay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finsecure-pay
          image: brucechoutw/finsecure-pay:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finsecure-pay-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay
spec:
  type: LoadBalancer
  selector:
    app: finsecure-pay
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
