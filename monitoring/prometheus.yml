global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: finsecure-pay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["finsecure-pay:8080"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
