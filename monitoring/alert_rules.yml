groups:
  - name: finsecure-pay-alerts
    rules:
      - alert: FinSecurePayDown
        expr: up{job="finsecure-pay"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "FinSecure Pay application is down"
          description: "Prometheus cannot scrape FinSecure Pay metrics."

      - alert: FinSecurePayHigh5xxRate
        expr: sum(rate(http_server_requests_seconds_count{job="finsecure-pay",status=~"5.."}[1m])) > 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "FinSecure Pay is returning HTTP 5xx errors"
          description: "The application has recorded HTTP 5xx responses."
