services:
  jenkins:
    build:
      context: ./jenkins
    container_name: finsecure-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"

volumes:
  jenkins_home:
    external: true
    name: capstone_assignment_jenkins_home
